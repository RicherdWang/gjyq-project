<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国技元启 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto bg-blue-600 rounded-xl mb-4 flex items-center justify-center">
                <i class="fas fa-cube text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">国技元启</h1>
            <p class="text-gray-500">项目管理系统</p>
        </div>
        <form id="login-form">
            <div class="mb-3">
                <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="账号" value="admin">
            </div>
            <div class="mb-4">
                <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="密码" value="123456">
            </div>
            <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-sign-in-alt mr-2"></i>登录
            </button>
        </form>
        <p class="text-center text-sm text-gray-400 mt-4">默认账号: admin / 密码: 123456</p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'admin' && password === '123456') {
                window.location.href = 'index.html';
            } else {
                alert('账号或密码错误！');
            }
        });
    </script>
</body>
</html>
